    <style>
        .markdown-body {
            padding-bottom: 8rem;
        }

        /* Custom Markdown Styling */
        .markdown-body h2 {
            font-size: 2.2rem;
            color: #fff;
            margin-top: 5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
        }

        .markdown-body h3 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-top: 3rem;
            margin-bottom: 1rem;
        }

        .markdown-body p {
            margin-bottom: 1.5rem;
            color: #d4d4d8;
            font-size: 1.1rem;
        }

        .markdown-body ul {
            margin-bottom: 2.5rem;
            padding-left: 0;
            list-style-type: none;
            background: rgba(20, 20, 20, 0.5);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Roadmap Checkbox styling */
        .markdown-body li {
            margin-bottom: 1rem;
            color: #d4d4d8;
            position: relative;
            padding-left: 2.5rem;
            display: flex;
            align-items: flex-start;
            line-height: 1.5;
            font-size: 1.05rem;
        }

        .markdown-body li:last-child {
            margin-bottom: 0;
        }

        .markdown-body input[type="checkbox"] {
            position: absolute;
            left: 0;
            top: 0.25rem;
            appearance: none;
            width: 1.4rem;
            height: 1.4rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            cursor: default;
        }

        .markdown-body input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 201, 241, 0.5);
        }

        .markdown-body input[type="checkbox"]:checked::after {
            content: "✓";
            color: white;
            position: absolute;
            top: -2px;
            left: 3px;
            font-size: 16px;
            font-weight: bold;
        }

        .markdown-body strong {
            color: #fff;
            font-weight: 600;
        }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #a5cbfc;
        }

        .markdown-body hr {
            border: 0;
            border-top: 1px solid var(--border-glass);
            margin: 3rem 0;
        }

        /* Premium Collapsible Roadmap Items */
        .collapsible-roadmap-item {
            padding-left: 0 !important;
            margin-bottom: 1.25rem;
            display: block !important;
        }

        .collapsible-roadmap-item details {
            width: 100%;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .collapsible-roadmap-item details:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(99, 208, 241, 0.18);
        }

        .collapsible-roadmap-item details[open] {
            background: rgba(255, 255, 255, 0.015);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .collapsible-roadmap-item summary {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.5rem;
            cursor: pointer;
            user-select: none;
            font-size: 1.05rem;
            color: #fff;
            list-style: none;
        }

        .collapsible-roadmap-item summary::-webkit-details-marker {
            display: none;
        }

        .collapsible-roadmap-item summary::after {
            content: "+";
            margin-left: auto;
            color: var(--text-muted);
            font-size: 1.4rem;
            font-weight: 300;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .collapsible-roadmap-item details[open] summary::after {
            transform: rotate(45deg);
            color: var(--primary);
        }

        .collapsible-roadmap-item summary input[type="checkbox"] {
            position: relative !important;
            margin-top: 0 !important;
            pointer-events: none;
            flex-shrink: 0;
        }

        .roadmap-details-content {
            padding: 0 1.5rem 1.5rem 3.8rem;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .roadmap-details-content ul {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin-top: 1rem;
            margin-bottom: 0 !important;
        }

        .roadmap-details-content li {
            padding-left: 1.5rem !important;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            position: relative;
            line-height: 1.6;
            display: block !important;
        }

        .roadmap-details-content li::before {
            content: "•";
            position: absolute;
            left: 0.25rem;
            top: 0.15rem;
            color: var(--primary);
            font-size: 1.2rem;
            line-height: 1;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            text-align: center;
            padding: 4rem;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .markdown-body ul {
                padding: 1.5rem;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const url = 'https://raw.githubusercontent.com/ysfemreAlbyrk/Fontager/main/roadmap.md';
            const contentDiv = document.getElementById('content');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const markdown = await response.text();

                // Parse markdown
                contentDiv.innerHTML = marked.parse(markdown);

                // Post-process to make roadmap items collapsible
                const listItems = contentDiv.querySelectorAll('li');
                listItems.forEach(li => {
                    const checkbox = li.querySelector('input[type="checkbox"]');
                    if (checkbox) {
                        const nodes = Array.from(li.childNodes);
                        
                        let dividerNodeIndex = -1;
                        let dividerText = '';
                        let dividerCharIndex = -1;
                        const dividerRegex = /\s*(?:—|–|-)\s+/; // Matches em-dash, en-dash, or hyphen-minus with spaces
                        
                        for (let i = 0; i < nodes.length; i++) {
                            const node = nodes[i];
                            if (node.nodeType === Node.TEXT_NODE) {
                                const match = node.textContent.match(dividerRegex);
                                if (match) {
                                    dividerNodeIndex = i;
                                    dividerText = match[0];
                                    dividerCharIndex = node.textContent.indexOf(dividerText);
                                    break;
                                }
                            }
                        }
                        
                        if (dividerNodeIndex !== -1) {
                            li.classList.add('collapsible-roadmap-item');
                            
                            const details = document.createElement('details');
                            const summary = document.createElement('summary');
                            const contentWrap = document.createElement('div');
                            contentWrap.className = 'roadmap-details-content';
                            
                            if (checkbox) {
                                summary.appendChild(checkbox);
                            }
                            
                            for (let i = 0; i < dividerNodeIndex; i++) {
                                if (nodes[i] !== checkbox) {
                                    summary.appendChild(nodes[i]);
                                }
                            }
                            
                            const dividerNode = nodes[dividerNodeIndex];
                            const titlePart = dividerNode.textContent.substring(0, dividerCharIndex);
                            const descPart = dividerNode.textContent.substring(dividerCharIndex + dividerText.length);
                            
                            if (titlePart.trim() || titlePart.length > 0) {
                                summary.appendChild(document.createTextNode(titlePart));
                            }
                            
                            if (descPart.trim() || descPart.length > 0) {
                                contentWrap.appendChild(document.createTextNode(descPart));
                            }
                            
                            for (let i = dividerNodeIndex + 1; i < nodes.length; i++) {
                                contentWrap.appendChild(nodes[i]);
                            }
                            
                            details.appendChild(summary);
                            details.appendChild(contentWrap);
                            
                            li.innerHTML = '';
                            li.appendChild(details);
                        }
                    }
                });
            } catch (error) {
                console.error('Error fetching markdown:', error);
                contentDiv.innerHTML = '<p style="color: #ef4444; text-align:center;">Failed to load content. Please try again later.</p>';
            }
        });
    </script>
