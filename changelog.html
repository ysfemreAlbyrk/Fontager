<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog - Fontager</title>
    <meta name="description" content="Changelog and release notes for Fontager.">

    <link rel="icon" href="Assets/Fontager_Logo.ico" type="image/x-icon">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ysfemrealbyrk.github.io/Fontager/">
    <meta property="og:title" content="Fontager - Modern Windows Font Manager & Viewer">
    <meta property="og:description"
        content="Fontager replaces the outdated Windows fontview.exe with a fast, beautiful font previewer and full-featured font management suite.">
    <meta property="og:image" content="https://ysfemrealbyrk.github.io/Fontager/Assets/banner.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ysfemrealbyrk.github.io/Fontager/">
    <meta property="twitter:title" content="Fontager - Modern Windows Font Manager & Viewer">
    <meta property="twitter:description"
        content="Fontager replaces the outdated Windows fontview.exe with a fast, beautiful font previewer and full-featured font management suite.">
    <meta property="twitter:image" content="https://ysfemrealbyrk.github.io/Fontager/Assets/banner.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --surface: #111111;
            --surface-glass: rgba(15, 15, 15, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #63d0f1;
            --primary-hover: #46b8e5;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #44a9ff;
            --glow: rgba(55, 166, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Floating Navbar */
        .nav-wrapper {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        nav {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 0.75rem 1.5rem;
            border-radius: 100px;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .logo img {
            height: 32px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .nav-links a.active {
            color: var(--primary);
        }

        .btn {
            background: #fff;
            color: #000;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: #e4e4e7;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Page Content */
        .page-header {
            padding: 12rem 0 4rem;
            text-align: center;
            position: relative;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: rgba(99, 172, 241, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }

        .page-header h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to bottom right, #34baff 30%, #63a3f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .timeline-container {
            padding-bottom: 8rem;
            position: relative;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 8rem;
            left: 24px;
            width: 2px;
            background: linear-gradient(to bottom, rgba(99, 172, 241, 0.5), rgba(99, 172, 241, 0.1));
            border-radius: 2px;
        }

        .pre-content {
            padding-left: 4rem;
            margin-bottom: 3rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .pre-content hr {
            border: none;
        }

        .changelog-card {
            margin-bottom: 4rem;
            position: relative;
            padding-left: 4rem;
        }

        .changelog-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 19px;
            width: 12px;
            height: 12px;
            background: var(--bg-color);
            border: 2px solid var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            z-index: 2;
        }

        .changelog-header {
            margin-bottom: 1.5rem;
        }

        /* e.g. ## [1.2.0] - 2026-05-15 */
        .changelog-header h2 {
            font-size: 1.8rem;
            color: #fff;
            line-height: 1.2;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: baseline;
        }

        .version-badge {
            background: rgba(99, 208, 241, 0.15);
            border: 1px solid rgba(99, 189, 241, 0.3);
            color: #81e6f8;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 1.25rem;
        }

        .version-date {
            font-size: 1rem;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .changelog-body {
            background: rgba(20, 20, 20, 0.5);
            border-radius: 20px;
            padding: 2.5rem;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .changelog-body .category-badge:first-child {
            margin-top: 0;
        }

        .changelog-body p {
            margin-bottom: 1rem;
            color: #d4d4d8;
            font-size: 1.05rem;
        }

        .changelog-body ul {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .changelog-body li {
            margin-bottom: 0.75rem;
            color: #d4d4d8;
            line-height: 1.6;
        }

        .changelog-body li::marker {
            color: var(--primary);
        }

        .changelog-body strong {
            color: #fff;
            font-weight: 600;
        }

        .changelog-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #34baff;
        }

        /* Footer */
        footer {
            padding: 4rem 0 2rem;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--border-glass);
        }

        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .footer-logo img {
            height: 24px;
        }

        .copyright {
            font-size: 0.9rem;
            margin-top: 2rem;
            opacity: 0.6;
        }

        .loader {
            text-align: center;
            padding: 4rem;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .timeline-container::before {
                left: 16px;
            }

            .changelog-card {
                padding-left: 3rem;
            }

            .changelog-card::before {
                left: 11px;
            }

            .changelog-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="nav-wrapper">
        <nav>
            <a href="index.html" class="logo">
                <img src="Assets/Fontager_Logo.png" alt="Fontager Logo">
                Fontager
            </a>
            <div class="nav-links">
                <a href="#features">Features</a>
                <a href="#showcase">Showcase</a>
                <a href="roadmap.html">Roadmap</a>
                <a href="changelog.html">Changelog</a>
                <a href="https://github.com/ysfemreAlbyrk/Fontager" target="_blank">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                        </path>
                    </svg>
                    GitHub
                </a>
            </div>
            <a href="https://github.com/ysfemreAlbyrk/Fontager/releases/latest" class="btn" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </a>
        </nav>
    </div>

    <header class="page-header container">
        <h1>Changelog</h1>
        <p>All notable changes and release notes for Fontager.</p>
    </header>

    <div class="container">
        <div id="content" class="timeline-container">
            <div class="loader">Loading changelog...</div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-logo">
                <img src="Assets/Fontager_Logo.png" alt="Logo">
                Fontager
            </div>
            <p>Free and open-source software(FOSS) under the MIT License.</p>
            <a href="https://4pp.studio" target="_blank"><img src="Assets/backedby.png" alt="Backed by 4PP Studio"
                    width="200px" style="margin-top: 2rem;" title="Backed by 4PP Studio"></a>
            <p class="copyright">created by © 2026 <a href="https://github.com/ysfemreAlbyrk" target="_blank"
                    style="color: #63d0f1; text-decoration: underline;">Yusuf Emre
                    Albayrak</a> with 💖</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const url = 'https://raw.githubusercontent.com/ysfemreAlbyrk/Fontager/79dafdd34f14d333ac2cee8eea5c62eac62f00bc/CHANGELOG.md';
            const contentDiv = document.getElementById('content');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const markdown = await response.text();

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = marked.parse(markdown);

                const finalContent = document.createDocumentFragment();
                let currentCard = null;
                let currentBody = null;

                Array.from(tempDiv.childNodes).forEach(node => {
                    // Skip empty text nodes
                    if (node.nodeType === 3 && !node.textContent.trim()) return;

                    if (node.tagName === 'H2') {
                        // Create a new timeline card
                        currentCard = document.createElement('div');
                        currentCard.className = 'changelog-card';

                        const headerDiv = document.createElement('div');
                        headerDiv.className = 'changelog-header';

                        const h2Text = node.textContent;
                        // Attempt to parse `[1.2.0] - 2026-05-15` or similar
                        const match = h2Text.match(/\[?(v?\d+\.\d+\.\d+)\]?(?:\s*-\s*(.*))?/i);

                        const newH2 = document.createElement('h2');
                        if (match) {
                            const version = match[1];
                            const date = match[2] || '';
                            newH2.innerHTML = `<span class="version-badge">v${version}</span> <span class="version-date">${date}</span>`;
                        } else {
                            newH2.innerHTML = `<span class="version-badge">${h2Text.replace('🎉', '').trim()}</span>`;
                        }

                        headerDiv.appendChild(newH2);
                        currentCard.appendChild(headerDiv);

                        currentBody = document.createElement('div');
                        currentBody.className = 'changelog-body';
                        currentCard.appendChild(currentBody);

                        finalContent.appendChild(currentCard);
                    } else if (node.tagName === 'H3') {
                        if (currentBody) {
                            const badge = document.createElement('div');
                            badge.className = 'category-badge';
                            badge.innerHTML = node.innerHTML;
                            currentBody.appendChild(badge);
                        }
                    } else {
                        if (currentBody) {
                            currentBody.appendChild(node.cloneNode(true));
                        } else {
                            // Intro content before the first H2
                            const pre = document.createElement('div');
                            pre.className = 'pre-content';
                            pre.appendChild(node.cloneNode(true));
                            finalContent.appendChild(pre);
                        }
                    }
                });

                contentDiv.innerHTML = '';
                contentDiv.appendChild(finalContent);
            } catch (error) {
                console.error('Error fetching markdown:', error);
                contentDiv.innerHTML = '<p style="color: #ef4444; text-align:center;">Failed to load content. Please try again later.</p>';
            }
        });
    </script>
</body>

</html>
